  <text x="50" y="171" fill="#f7f8ff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">Med Aziz Hraghi</text>
  <text x="54" y="219" fill="#c6c9dd" font-family="Arial, Helvetica, sans-serif" font-size="25">Building AI systems that work in the real world.</text>
  <text x="55" y="272" fill="#8cebdc" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="1.3">MULTI-AGENT AI  /  RAG  /  COMPUTER VISION</text>

  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".7">
    <path d="M 824 117 L 907 77 L 1001 116 L 1084 68"/>
