    <circle cx="1001" cy="116" r="18"/><circle cx="1084" cy="68" r="13"/>
    <circle cx="902" cy="179" r="13"/><circle cx="1094" cy="184" r="13"/>
    <circle cx="1000" cy="239" r="13"/>
